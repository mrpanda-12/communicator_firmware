[package]
edition      = "2024"
name         = "communicator"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "communicator"
path = "./src/bin/main.rs"

[features]
default = ["fake-navigator"]
fake-navigator = []

[dependencies]
esp-hal = { version = "~1.2.2", features = ["defmt", "esp32s3", "unstable"] }
esp-storage = { version = "0.10.0", features = ["embedded-storage", "esp32s3"] }
sequential-storage = { version = "8.0.2", default-features = false }
embassy-embedded-hal = "0.6.0"
sha2 = { version = "0.11.1", default-features = false }
sha2_010 = { package = "sha2", version = "0.10.9", default-features = false }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
nmea = { version = "0.8.0", default-features = false, features = ["GGA", "RMC"] }
chrono = { version = "0.4", default-features = false }

esp-rtos = { version = "0.4.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32s3",
] }

defmt                  = "1.2.0"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32s3"] }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "defmt",
  "esp32s3",
  "panic-handler",
] }
esp-println = { version = "0.18.0", features = ["defmt-espflash", "esp32s3"] }

critical-section = "1.2.0"
ed25519-dalek = "3.0.0"
heapless = "0.9.3"
libm = "0.2.16"
embedded-hal = "1.0.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embedded-hal-bus = "0.3.0"
embedded-graphics = "0.8.1"
mipidsi = "0.10.0"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
